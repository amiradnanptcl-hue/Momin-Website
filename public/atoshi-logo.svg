<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5921F"/>
      <stop offset="100%" stop-color="#E8781A"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <g fill="white">
    <!-- Three curved arcs connecting nodes -->
    <!-- Arc 1: Top to Bottom-Right -->
    <path d="M215,150 Q310,100 355,205" stroke="white" fill="none" stroke-width="38" stroke-linecap="round"/>
    <!-- Arc 2: Bottom-Right to Bottom-Left -->
    <path d="M355,205 Q370,340 175,365" stroke="white" fill="none" stroke-width="38" stroke-linecap="round"/>
    <!-- Arc 3: Bottom-Left to Top -->
    <path d="M175,365 Q110,220 215,150" stroke="white" fill="none" stroke-width="38" stroke-linecap="round"/>

    <!-- Node 1: Top - 4-pointed star -->
    <circle cx="215" cy="150" r="28" fill="white"/>
    <path d="M215,108 L220,140 215,108z M215,192 L210,160 215,192z M173,150 L205,145 173,150z M257,150 L225,155 257,150z" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <line x1="215" y1="108" x2="215" y2="192" stroke="white" stroke-width="8"/>
    <line x1="173" y1="150" x2="257" y2="150" stroke="white" stroke-width="8"/>
    <line x1="188" y1="123" x2="242" y2="177" stroke="white" stroke-width="6"/>
    <line x1="242" y1="123" x2="188" y2="177" stroke="white" stroke-width="6"/>

    <!-- Node 2: Bottom-Right - 4-pointed star -->
    <circle cx="355" cy="205" r="28" fill="white"/>
    <line x1="355" y1="163" x2="355" y2="247" stroke="white" stroke-width="8"/>
    <line x1="313" y1="205" x2="397" y2="205" stroke="white" stroke-width="8"/>
    <line x1="328" y1="178" x2="382" y2="232" stroke="white" stroke-width="6"/>
    <line x1="382" y1="178" x2="328" y2="232" stroke="white" stroke-width="6"/>

    <!-- Node 3: Bottom-Left - 4-pointed star -->
    <circle cx="175" cy="365" r="28" fill="white"/>
    <line x1="175" y1="323" x2="175" y2="407" stroke="white" stroke-width="8"/>
    <line x1="133" y1="365" x2="217" y2="365" stroke="white" stroke-width="8"/>
    <line x1="148" y1="338" x2="202" y2="392" stroke="white" stroke-width="6"/>
    <line x1="202" y1="338" x2="148" y2="392" stroke="white" stroke-width="6"/>
  </g>
</svg>
